packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # onnxruntime-node ships CPU binaries in the tarball; its postinstall only fetches CUDA extras.
  onnxruntime-node: false
  # protobufjs postinstall is a version notice only.
  protobufjs: false
  # mongodb-memory-server downloads mongod lazily on first use; skip the install-time download.
  mongodb-memory-server: false
  msgpackr-extract: true
  # msw postinstall only copies the worker script; apps/web runs `msw init` explicitly.
  msw: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.72.1'
  - '@typescript-eslint/parser@8.72.1'
  - '@typescript-eslint/project-service@8.72.1'
  - '@typescript-eslint/scope-manager@8.72.1'
  - '@typescript-eslint/tsconfig-utils@8.72.1'
  - '@typescript-eslint/type-utils@8.72.1'
  - '@typescript-eslint/types@8.72.1'
  - '@typescript-eslint/typescript-estree@8.72.1'
  - '@typescript-eslint/utils@8.72.1'
  - '@typescript-eslint/visitor-keys@8.72.1'
  - bullmq@6.5.0
  - typescript-eslint@8.72.1
  - '@ai-sdk/gateway@4.0.127'
  - '@ai-sdk/openai-compatible@3.0.79'
  - '@ai-sdk/provider-utils@5.0.69'
  - ai@7.0.154
  - '@hookform/resolvers@6.0.1'
  - framer-motion@14.7.1
  - lucide-react@1.62.0
  - motion-dom@14.7.1
  - motion-utils@14.7.0
  - motion@14.7.1
