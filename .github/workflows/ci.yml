name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  VECTOR_SEARCH: memory
  REDIS_URL: redis://localhost:6379
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Detect Playwright
        id: pw
        run: |
          if ls apps/web/playwright.config.* >/dev/null 2>&1; then
            version=$(pnpm --filter @kestrel/web exec playwright --version | awk '{print $2}')
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Playwright $version"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "apps/web has no playwright config yet; browsers not installed"
          fi

      - name: Cache Playwright browsers
        if: steps.pw.outputs.enabled == 'true'
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers + OS deps
        if: steps.pw.outputs.enabled == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kestrel/web exec playwright install --with-deps

      - name: Install Playwright OS deps (browsers cached)
        if: steps.pw.outputs.enabled == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @kestrel/web exec playwright install-deps

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: always() && steps.pw.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
