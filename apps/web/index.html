<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme bootstrap: runs before any CSS so the first paint already has the right theme,
         accent, density, text size and motion preference (DESIGN §6.0 rule 5). Keep it tiny.
         If a CSP is added, hash this script. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var a = {};
          try {
            a = JSON.parse(localStorage.getItem('beacon:appearance') || '{}') || {};
          } catch (e) {}
          var p = location.pathname;
          // Public pages (landing, sign-in) always use the brand accent.
          var landing = p === '/' || p === '' || p === '/login';
          // Light is the default; 'system' follows the OS only when the user chose it in Settings.
          var t =
            a.theme === 'light' || a.theme === 'dark'
              ? a.theme
              : a.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          d.classList.toggle('dark', t === 'dark');
          d.setAttribute('data-theme', t);
          if (!landing && (a.accent === 'teal' || a.accent === 'amber' || a.accent === 'ink'))
            d.setAttribute('data-accent', a.accent);
          d.setAttribute('data-density', a.density === 'compact' ? 'compact' : 'comfortable');
          d.setAttribute(
            'data-font-size',
            a.fontSize === 'sm' || a.fontSize === 'lg' || a.fontSize === 'xl' ? a.fontSize : 'md',
          );
          if (a.motion === 'reduced' || a.motion === 'full')
            d.setAttribute('data-motion', a.motion);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beacon · Every opportunity that fits you</title>
    <meta
      name="description"
      content="Beacon watches internships, jobs, hackathons, scholarships and research programs, and ranks each one against your resume with reasons. Free. Bring your own AI key, or switch AI off."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F1A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beacon" />
    <link rel="canonical" href="__WEB_URL__/" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/png/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/png/apple-touch-icon.png" />

    <!-- Social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beacon" />
    <meta
      property="og:title"
      content="Beacon · Every opportunity that fits you. Nothing that doesn't."
    />
    <meta
      property="og:description"
      content="Internships, hackathons and scholarships, ranked against your resume, with reasons."
    />
    <meta property="og:url" content="__WEB_URL__/" />
    <meta property="og:image" content="__WEB_URL__/brand/png/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Beacon: every opportunity that fits you. Nothing that doesn't."
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta

      content="Beacon · Every opportunity that fits you. Nothing that doesn't."
    />

      name="twitter:description"
      content="Internships, hackathons and scholarships, ranked against your resume, with reasons."
    />
    <meta name="twitter:image" content="__WEB_URL__/brand/png/og-image.png" />
  </head>
  <body>
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-tooltip focus:rounded-sm focus:bg-overlay focus:px-3 focus:py-2 focus:text-body focus:shadow-md"
      >Skip to content</a
    >
    <div id="root"><!--app-html--></div>
    <!-- Boot skeleton: visible from first paint until React renders (no page is ever blank while the
         mock worker / lazy route / data load). Removed by main.tsx right before render. -->
    <div
      id="boot-skeleton"
      aria-hidden="true"
      style="
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: var(--color-bg, #f5f7fb);
      "
    >
      <div
        style="
          height: 48px;
          border-bottom: 1px solid var(--color-border-subtle, rgba(16, 24, 40, 0.06));
          background: var(--color-glass, rgba(251, 252, 254, 0.78));
        "
      ></div>
      <div style="max-width: 1280px; margin: 40px auto 0; padding: 0 24px">
        <div
          style="
            height: 28px;
            width: 180px;
            border-radius: 8px;
            background: var(--color-surface-sunken, #eef1f7);
          "
        ></div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-top: 24px;
          "
        >
          <div
            style="
              height: 150px;
              border-radius: 12px;
              background: var(--color-surface-sunken, #eef1f7);
            "
          ></div>
          <div
            style="
              height: 150px;
              border-radius: 12px;
              background: var(--color-surface-sunken, #eef1f7);
            "
          ></div>
          <div
            style="
              height: 150px;
              border-radius: 12px;
              background: var(--color-surface-sunken, #eef1f7);
            "
          ></div>
          <div
            style="
              height: 150px;
              border-radius: 12px;
              background: var(--color-surface-sunken, #eef1f7);
            "
          ></div>
          <div
            style="
              height: 150px;
              border-radius: 12px;
              background: var(--color-surface-sunken, #eef1f7);
            "
          ></div>
          <div
            style="
              height: 150px;
              border-radius: 12px;
              background: var(--color-surface-sunken, #eef1f7);
            "
          ></div>
        </div>
      </div>
    </div>
    <script>
      // Prerendered markup is only valid for the path it was rendered for: other routes start empty,
      // so an app route never flashes the landing page, not even for one frame.
      (function () {
        var r = document.getElementById('root');
        if (r && r.getAttribute('data-prerendered') !== location.pathname) {
          r.removeAttribute('data-prerendered');
          r.textContent = '';
        }
      })();
    </script>
    <noscript>Beacon needs JavaScript to rank opportunities for you.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
