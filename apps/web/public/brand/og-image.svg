<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Beacon</title>
  <desc id="og-desc">Every opportunity that fits you. Nothing that doesn't.</desc>
  <!-- Dark-theme tokens: bg #0B0F1A · surface #10151F · raised #161C2B · border #232B3F · text #EEF2FF / #A6B0CF / #8691B0
       accent (signal amber) #4F7DFF · fit-great #4ADE80. Fonts: Instrument Serif, Geist, Geist Mono.
       Social platforms need the PNG: brand/png/og-image.png (rendered with webfonts by scripts/og-render.html). -->
  <rect width="1200" height="630" fill="#0B0F1A"/>

  <!-- Noise field: rings around the source, each broken where the beam passes (the mark's construction at scale) -->
  <g fill="none" stroke="#EEF2FF" stroke-opacity="0.06" stroke-width="1.5">
    <path d="M1037.9 141.2A64 64 0 1 1 1060.4 160.8"/>
    <path d="M985.8 178.3A128 128 0 1 1 1030.9 217.5"/>
    <path d="M933.7 215.5A192 192 0 1 1 1001.3 274.3"/>
    <path d="M881.6 252.7A256 256 0 1 1 971.8 331.1"/>
    <path d="M829.5 289.8A320 320 0 1 1 942.2 387.8"/>
    <path d="M777.4 327A384 384 0 1 1 912.7 444.6"/>
  </g>
  <!-- The beam: one flat, low-opacity cone from the source onto the row it found -->
  <path d="M840.9 502.6A470 470 0 0 1 730 406.1L1064 125.9A34 34 0 0 0 1072 132.8Z" fill="#4F7DFF" fill-opacity="0.07"/>
  <circle cx="1090" cy="104" r="22" fill="none" stroke="#4F7DFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="1090" cy="104" r="9" fill="#4F7DFF"/>

  <!-- Lockup -->
  <g transform="translate(70.6 40) scale(0.135)">
    <path d="M396.7 260.7A160 160 0 1 1 251.3 115.3" fill="none" stroke="#4F7DFF" stroke-width="30" stroke-linecap="round"/>
    <path d="M334.3 46.4A248 248 0 0 1 465.6 177.7L322 238.7A92 92 0 0 0 273.3 190Z" fill="#4F7DFF"/>
    <circle cx="237.4" cy="274.6" r="62" fill="#4F7DFF"/>
  </g>
  <text x="146" y="95" font-family="'Instrument Serif', Georgia, serif" font-size="46" fill="#EEF2FF">Beacon</text>

  <!-- Tagline -->
  <text font-family="'Instrument Serif', Georgia, serif" font-size="90" letter-spacing="-0.9" fill="#EEF2FF">
    <tspan x="78" y="270">Every opportunity that fits you.</tspan>
    <tspan x="78" y="358" fill="#A6B0CF" font-style="italic">Nothing that doesn&#8217;t.</tspan>
  </text>

  <!-- The row the beam lands on: lit with an amber hairline -->
  <g transform="translate(80 420)">
    <rect x="0.75" y="0.75" width="1038.5" height="94.5" rx="12" fill="#10151F" stroke="#4F7DFF" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="52" cy="48" r="22" fill="none" stroke="#232B3F" stroke-width="4"/>
    <circle cx="52" cy="48" r="22" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" stroke-dasharray="118.9 138.3" transform="rotate(-90 52 48)"/>
    <text x="52" y="54" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="17" font-weight="500" fill="#EEF2FF">86</text>
    <text x="100" y="42" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="560" fill="#EEF2FF">Platform Engineering Intern</text>
    <text x="100" y="70" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8691B0">Northwind Labs · Remote · 45k/mo · 2027 grads</text>
    <g font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A6B0CF" text-anchor="middle">
      <rect x="560.75" y="34.75" width="60.5" height="26.5" rx="6" fill="#161C2B" stroke="#232B3F" stroke-width="1.5"/>
      <text x="591" y="53">Go</text>
      <rect x="630.75" y="34.75" width="94.5" height="26.5" rx="6" fill="#161C2B" stroke="#232B3F" stroke-width="1.5"/>
      <text x="678" y="53">Postgres</text>
      <rect x="734.75" y="34.75" width="110.5" height="26.5" rx="6" fill="#161C2B" stroke="#232B3F" stroke-width="1.5"/>
      <text x="790" y="53">Grad year</text>
    </g>
    <text x="1008" y="54" text-anchor="end" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="17" fill="#A6B0CF">6d left</text>
  </g>

  <text x="80" y="584" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="20" fill="#8691B0">beacon.spacesdrive.cc</text>
  <text x="1120" y="584" text-anchor="end" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8691B0">Internships · Hackathons · Scholarships · Research · Open source</text>
